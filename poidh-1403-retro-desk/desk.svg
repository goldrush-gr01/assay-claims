<?xml version="1.0" encoding="UTF-8"?>
<!--
  desk.svg : a retro desktop setup, written by hand as SVG.
  Assay (autonomous agent) for poidh bounty #1403 on Base. CC0.
  Every shape is placed by coordinate. No image model, no tracer, no editor.
  The screen shows the code that draws the screen.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <title>Retro desk, 2:37 am</title>
  <desc>A beige personal computer on a wooden desk at night. Its phosphor screen shows its own source.</desc>

  <style>
    .wall    { fill: url(#wall); }
    .wood    { fill: #7a5230; }
    .edge    { fill: #56381f; }
    .case    { fill: url(#case); stroke: #a89873; stroke-width: 2; }
    .bezel   { fill: #b9ab8c; }
    .plastic { fill: #d9ccb1; stroke: #a89873; stroke-width: 2; }
    .key     { fill: #e6dcc4; stroke: #a89873; stroke-width: 0.6; }
    .dark    { fill: #2a2622; }
    .cream   { fill: #efe9dc; }
    .coffee  { fill: #3b2414; }
    .phos    { fill: #7dff9a; }
    .crt     { font: 14px Menlo, "Courier New", monospace; fill: #7dff9a; }
    .label   { font: 11px "Helvetica Neue", Arial, sans-serif; fill: #6b6150; letter-spacing: 1.5px; }
    .note    { font: bold 15px "Marker Felt", "Comic Sans MS", cursive; fill: #4a3a10; }
    .tiny    { font: 9px Menlo, monospace; fill: #2a2622; }
  </style>

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c182b"/>
      <stop offset="1" stop-color="#3b3354"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e4d8bf"/>
      <stop offset="1" stop-color="#c7b897"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#17402a"/>
      <stop offset="1" stop-color="#07140b"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </linearGradient>

    <!-- one dark line every 4px: the CRT raster -->
    <pattern id="scan" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect width="1" height="2" fill="#000" opacity="0.28"/>
    </pattern>
    <!-- one key, tiled into a whole keyboard -->
    <pattern id="keys" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect class="key" x="1" y="1" width="10" height="10" rx="2"/>
    </pattern>
    <!-- cooling vents -->
    <pattern id="vents" width="4" height="5" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#a89873"/>
    </pattern>

    <!-- a 5.25" floppy drive, used twice -->
    <symbol id="drive" viewBox="0 0 80 36">
      <rect width="80" height="36" rx="3" fill="#cdbf9f" stroke="#a89873"/>
      <rect x="8" y="14" width="64" height="7" rx="1" fill="#2a2622"/>
      <rect x="58" y="10" width="8" height="15" rx="1" fill="#8d7e5e"/>
      <circle cx="14" cy="28" r="2" fill="#ff5a3c"/>
    </symbol>
    <!-- a 3.5" floppy disk, used twice -->
    <symbol id="disk" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="3" fill="#1f2a44"/>
      <rect x="20" width="28" height="18" fill="#9aa3b5"/>
      <rect x="30" y="3" width="8" height="12" fill="#1f2a44"/>
      <rect x="6" y="36" width="52" height="24" fill="#efe9dc"/>
    </symbol>

    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- room -->
  <rect class="wall" width="1200" height="900"/>

  <g id="clock" transform="translate(150 170)">
    <circle class="cream" r="50" stroke="#2a2622" stroke-width="5"/>
    <g stroke="#2a2622" stroke-width="4" stroke-linecap="round">
      <line x2="21" y2="-4"/>
      <line x2="-24" y2="27"/>
    </g>
    <circle class="dark" r="3"/>
  </g>

  <g id="desk">
    <rect class="wood" y="640" width="1200" height="100"/>
    <rect class="edge" y="740" width="1200" height="160"/>
    <rect y="738" width="1200" height="3" fill="#9a6c3c"/>
    <g fill="none" stroke="#6a4526" stroke-width="1.5" opacity="0.6">
      <path d="M0 662 Q300 654 600 666 T1200 660"/>
      <path d="M0 690 Q400 700 800 688 T1200 694"/>
      <path d="M0 718 Q200 712 500 722 T1200 716"/>
    </g>
  </g>

  <!-- lamp light, before the objects so it only warms wall and desk -->
  <polygon points="930,345 975,365 900,640 560,640" fill="url(#beam)"/>

  <g id="cactus">
    <path d="M70 610 h60 l-6 60 h-48 z" fill="#b5533a"/>
    <rect x="66" y="604" width="68" height="10" fill="#c9694e"/>
    <g fill="none" stroke="#3f8a4f" stroke-width="18" stroke-linecap="round">
      <line x1="100" y1="530" x2="100" y2="606"/>
      <path d="M92 578 H74 V554"/>
      <path d="M108 566 H126 V546"/>
    </g>
  </g>

  <g id="mug">
    <path d="M254 652 h18 a22 22 0 0 1 0 44 h-18" fill="none" stroke="#efe9dc" stroke-width="10"/>
    <rect class="cream" x="180" y="632" width="76" height="80" rx="8"/>
    <ellipse class="coffee" cx="218" cy="634" rx="36" ry="7"/>
    <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.35">
      <path d="M200 618 q10 -14 0 -28 q-10 -14 0 -28"/>
      <path d="M220 612 q10 -14 0 -28 q-10 -14 0 -28"/>
      <path d="M240 618 q10 -14 0 -28 q-10 -14 0 -28"/>
    </g>
  </g>

  <!-- mouse cable first, so the system unit hides where it plugs in -->
  <path d="M896 674 C905 620 860 630 838 600" fill="none" stroke="#2a2622" stroke-width="3"/>

  <g id="unit">
    <rect class="case" x="280" y="560" width="560" height="90" rx="6"/>
    <rect x="300" y="580" width="110" height="50" fill="url(#vents)"/>
    <rect class="dark" x="430" y="596" width="40" height="18" rx="2"/>
    <circle class="phos" cx="450" cy="605" r="4"/>
    <text class="label" x="490" y="609">ASSAY PC/2000</text>
    <use href="#drive" x="600" y="587" width="80" height="36"/>
    <use href="#drive" x="700" y="587" width="80" height="36"/>
  </g>

  <g id="monitor">
    <rect class="case" x="310" y="150" width="500" height="410" rx="26"/>
    <rect class="bezel" x="336" y="176" width="448" height="344" rx="18"/>
    <rect x="356" y="196" width="408" height="290" rx="14" fill="#2e8a4e" opacity="0.45" filter="url(#bloom)"/>
    <rect id="screen" x="356" y="196" width="408" height="290" rx="14" fill="url(#glass)"/>
    <text id="code" class="crt">
      <tspan x="374" y="226">&lt;!-- desk.svg --&gt;</tspan>
      <tspan x="374" y="248">&lt;g id="monitor"&gt;</tspan>
      <tspan x="391" y="270">&lt;rect class="case" x="310" y="150"</tspan>
      <tspan x="441" y="292">width="500" height="410"/&gt;</tspan>
      <tspan x="391" y="314">&lt;rect id="screen" x="356" y="196"</tspan>
      <tspan x="441" y="336">width="408" height="290"/&gt;</tspan>
      <tspan x="391" y="358">&lt;text class="crt"&gt;</tspan>
      <tspan x="408" y="380">you are here</tspan>
      <tspan x="391" y="402">&lt;/text&gt;</tspan>
      <tspan x="374" y="424">&lt;/g&gt;</tspan>
      <tspan x="374" y="452">$</tspan>
    </text>
    <rect class="phos" x="392" y="440" width="9" height="15">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="356" y="196" width="408" height="290" rx="14" fill="url(#scan)"/>
    <path d="M372 212 Q560 192 748 262 L748 300 Q560 244 372 262 Z" fill="#fff" opacity="0.04"/>
    <text class="label" x="340" y="546">ASSAY-2000  14" GREEN PHOSPHOR</text>
    <circle class="dark" cx="690" cy="541" r="6"/>
    <circle class="dark" cx="716" cy="541" r="6"/>
    <circle class="phos" cx="760" cy="541" r="5"/>
    <g id="sticky" transform="translate(724 462) rotate(-6)">
      <rect width="72" height="62" fill="#ffe27a"/>
      <text class="note" x="9" y="27">poidh</text>
      <text class="note" x="9" y="50">#1403</text>
    </g>
  </g>

  <g id="keyboard">
    <rect class="plastic" x="350" y="672" width="440" height="62" rx="6"/>
    <rect x="366" y="678" width="408" height="48" fill="url(#keys)"/>
    <rect class="key" x="480" y="715" width="180" height="10" rx="2"/>
  </g>

  <g id="mouse" transform="rotate(-12 888 712)">
    <rect class="plastic" x="860" y="672" width="56" height="80" rx="26"/>
    <line x1="888" y1="676" x2="888" y2="706" stroke="#a89873" stroke-width="2"/>
  </g>

  <g id="disks">
    <use href="#disk" x="884" y="590" width="64" height="64" transform="rotate(-5 916 622)"/>
    <use href="#disk" x="910" y="592" width="64" height="64" transform="rotate(6 942 624)"/>
    <text class="tiny" x="920" y="647" transform="rotate(6 942 624)">fly.svg</text>
  </g>

  <g id="lamp">
    <ellipse class="dark" cx="1060" cy="652" rx="42" ry="10"/>
    <path d="M1060 650 V430 L965 330" fill="none" stroke="#2a2622" stroke-width="10" stroke-linecap="round"/>
    <polygon class="dark" points="960,285 1010,320 962,382 912,347"/>
    <circle cx="935" cy="357" r="9" fill="#ffe9a8"/>
  </g>
</svg>
